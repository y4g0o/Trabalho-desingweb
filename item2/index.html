<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Item 2 — Layout Colorido</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrapper">

    <header class="page-header">
      <h1>Catppuccin Mocha</h1>
      <p>Paleta de cores &mdash; Hyprland Dark</p>
    </header>

    <div class="color-grid">
      <div class="cell" style="grid-area: mauve; background: #cba6f7;">
        <span class="label"><b>Mauve</b><small>#cba6f7</small></span>
      </div>
      <div class="cell" style="grid-area: blue; background: #89b4fa;">
        <span class="label"><b>Blue</b><small>#89b4fa</small></span>
      </div>
      <div class="cell" style="grid-area: teal; background: #94e2d5;">
        <span class="label"><b>Teal</b><small>#94e2d5</small></span>
      </div>
      <div class="cell" style="grid-area: red; background: #f38ba8;">
        <span class="label"><b>Red</b><small>#f38ba8</small></span>
      </div>
      <div class="cell" style="grid-area: lavnd; background: #b4befe;">
        <span class="label"><b>Lavender</b><small>#b4befe</small></span>
      </div>
      <div class="cell" style="grid-area: green; background: #a6e3a1;">
        <span class="label"><b>Green</b><small>#a6e3a1</small></span>
      </div>
      <div class="cell" style="grid-area: peach; background: #fab387;">
        <span class="label"><b>Peach</b><small>#fab387</small></span>
      </div>
      <div class="cell" style="grid-area: pink; background: #f5c2e7;">
        <span class="label"><b>Pink</b><small>#f5c2e7</small></span>
      </div>
      <div class="cell" style="grid-area: sky; background: #89dceb;">
        <span class="label"><b>Sky</b><small>#89dceb</small></span>
      </div>
      <div class="cell" style="grid-area: yello; background: #f9e2af;">
        <span class="label"><b>Yellow</b><small>#f9e2af</small></span>
      </div>
      <div class="cell" style="grid-area: flamn; background: #f2cdcd;">
        <span class="label"><b>Flamingo</b><small>#f2cdcd</small></span>
      </div>
      <div class="cell" style="grid-area: marrn; background: #eba0ac;">
        <span class="label"><b>Maroon</b><small>#eba0ac</small></span>
      </div>
      <div class="cell" style="grid-area: sapph; background: #74c7ec;">
        <span class="label"><b>Sapphire</b><small>#74c7ec</small></span>
      </div>
    </div>

  </main>
</body>
</html>
